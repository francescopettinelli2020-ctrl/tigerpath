<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TigerPath">
<title>TigerPath — Taekwondo for Kids</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#121933; --card:#161f3f; --card2:#1d284f; --line:#28345f;
    --ink:#eaf0ff; --muted:#93a0c8; --brand:#ff7a1a; --brand2:#ffb020;
    --red:#ff5468; --gold:#ffcf3f; --green:#2fd07a; --blue:#3aa0ff; --purple:#8b6bff; --teal:#22c9c0;
    --accent:var(--brand); --radius:20px; --fs:1; --shadow:0 14px 34px rgba(0,0,0,.42);
  }
  [data-theme="light"]{ --bg:#f2f5ff; --bg2:#e7ecfb; --card:#ffffff; --card2:#f3f6ff; --line:#dde3f5;
    --ink:#14203f; --muted:#5c688f; --shadow:0 14px 30px rgba(50,70,150,.14); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:radial-gradient(1100px 620px at 50% -14%,#25306b 0%,var(--bg) 55%);
    color:var(--ink);min-height:100vh;overflow-x:hidden;font-size:calc(16px*var(--fs));transition:background .4s,color .3s}
  [data-theme="light"] body{background:radial-gradient(1100px 620px at 50% -14%,#cfd9ff 0%,var(--bg) 52%)}
  .app{max-width:540px;margin:0 auto;padding:0 0 106px;position:relative;min-height:100vh}
  .ic{display:inline-block;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .ic.f{fill:currentColor;stroke:none}

  header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);
    background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent),color-mix(in srgb,var(--bg) 66%,transparent));
    padding:12px 15px 10px;border-bottom:1px solid var(--line)}
  .brandrow{display:flex;align-items:center;gap:9px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px}
  .brand span{color:var(--brand)}
  .hdricons{margin-left:auto;display:flex;gap:7px;align-items:center}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;
    height:36px;min-width:36px;padding:0 9px;border-radius:12px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;justify-content:center;transition:transform .1s}
  .iconbtn:active{transform:scale(.9)}
  .avatarChip{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;cursor:pointer;border:2px solid rgba(255,255,255,.25)}
  .xpwrap{margin-top:10px;display:flex;align-items:center;gap:10px}
  .beltdot{width:32px;height:32px;border-radius:9px;flex:0 0 auto;border:2px solid rgba(255,255,255,.28);position:relative;overflow:hidden;cursor:pointer}
  .beltdot .stripe{position:absolute;left:0;right:0;bottom:0;height:34%}
  .xpbar{flex:1;height:11px;background:color-mix(in srgb,var(--bg) 55%,#000);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
  .xpfill{height:100%;width:20%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .6s}
  .lvltext{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .streak{font-size:12px;font-weight:800;color:var(--brand2);white-space:nowrap;display:flex;align-items:center;gap:3px}

  main{padding:16px}
  .screen{display:none;animation:fade .34s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2.title{font-size:23px;margin:2px 0 4px;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.45}

  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

  .hero{background:linear-gradient(135deg,#ff7a1a,#ff5468 60%,#8b6bff);border:none;border-radius:24px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;color:#fff}
  .hero .hmascot{position:absolute;right:-6px;bottom:-10px;opacity:.9}
  .hero .hi{font-size:20px;font-weight:800}
  .hero .hs{color:rgba(255,255,255,.92);font-size:13px;margin-top:4px;line-height:1.45;max-width:74%}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .tile{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:transform .12s,border-color .2s;box-shadow:var(--shadow)}
  .tile:active{transform:scale(.96)}
  .tile .tico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
  .tile .lbl{font-weight:800;margin-top:9px;font-size:15px}
  .tile .desc{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:#241200;border:none;font-weight:800;font-size:14px;padding:12px 16px;border-radius:14px;cursor:pointer;margin-top:12px;transition:transform .1s}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.green{background:var(--green);color:#04240f} .btn.blue{background:var(--blue);color:#042038} .btn.purple{background:var(--purple);color:#fff}
  .btn.block{width:100%} .btn:active{transform:scale(.97)}

  .seg{display:flex;background:color-mix(in srgb,var(--bg) 55%,#000);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;gap:2px;overflow-x:auto}
  [data-theme="light"] .seg{background:var(--card2)}
  .seg button{flex:1;min-width:max-content;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;padding:9px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2)}

  .belt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:transform .1s}
  .belt:active{transform:scale(.98)}
  .beltbar{width:46px;height:26px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(0,0,0,.25);position:relative;overflow:hidden}
  .beltbar .stripe{position:absolute;left:0;right:0;height:34%;bottom:0}
  .belt .bname{font-weight:800;font-size:14px} .belt .bmeta{color:var(--muted);font-size:11.5px;margin-top:1px}
  .belt .chev{margin-left:auto;color:var(--muted)} .belt.done{border-color:var(--green)} .belt.done .chev{color:var(--green)}

  .row{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .rico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);display:flex;align-items:center;justify-content:center}
  .row .rt{font-weight:800;font-size:14px} .row .rd{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
  .vlink{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:12.5px;text-decoration:none;margin-top:7px;background:color-mix(in srgb,var(--blue) 14%,transparent);border:1px solid color-mix(in srgb,var(--blue) 38%,transparent);padding:6px 10px;border-radius:10px;cursor:pointer}
  .vlink:active{transform:scale(.97)}
  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
  .check.on{background:var(--green);border-color:var(--green);color:#04240f}

  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .pillar{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
  .pillar .pico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
  .pillar .pn{font-weight:800;font-size:14px;margin-top:8px} .pillar .pd{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.4}
  .quest{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
  .quest .qico{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--purple);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .quest .qn{font-weight:800;font-size:13.5px} .quest .qd{color:var(--muted);font-size:11.5px;margin-top:1px}

  .bcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3aa0ff,#2a1d7a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;text-align:center;color:#fff;box-shadow:0 0 60px rgba(58,160,255,.4);transition:transform 4s ease-in-out;margin:14px auto 18px}
  .bcircle.inhale{transform:scale(1.28)} .bcircle.exhale{transform:scale(.82)}
  .breathe{display:flex;flex-direction:column;align-items:center} .bcount{color:var(--muted);font-size:13px;margin-bottom:8px;text-align:center}

  .badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
  .badge.locked{opacity:.34;filter:grayscale(1)}
  .badge .bico{width:40px;height:40px;margin:0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
  .badge .bl{font-size:10.5px;font-weight:800;margin-top:6px}
  .stat{display:flex;gap:12px;margin-bottom:14px}
  .stat .box{flex:1;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .stat .n{font-size:23px;font-weight:800} .stat .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:540px;margin:0 auto;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 72%,transparent),color-mix(in srgb,var(--bg) 97%,transparent));backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;transition:color .2s}
  nav.tabs button .ti{transition:transform .2s;display:flex} nav.tabs button.on{color:var(--accent)} nav.tabs button.on .ti{transform:translateY(-2px) scale(1.1)}

  .sheet{position:fixed;inset:0;z-index:80;background:rgba(3,6,18,.66);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheetcard{background:var(--bg2);border:1px solid var(--line);border-top-left-radius:26px;border-top-right-radius:26px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 44px rgba(0,0,0,.55);animation:up .32s ease;position:relative}
  @keyframes up{from{transform:translateY(34px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
  .sheetcard h3{margin:0 0 4px;font-size:19px}
  .closebtn{position:absolute;right:16px;top:14px;background:var(--card2);border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
  .meaning{background:color-mix(in srgb,var(--blue) 12%,transparent);border:1px solid color-mix(in srgb,var(--blue) 34%,transparent);border-radius:12px;padding:11px 13px;margin:10px 0;font-size:13px;line-height:1.55}
  .toast{position:fixed;bottom:114px;left:50%;transform:translateX(-50%);background:var(--green);color:#04240f;font-weight:800;font-size:13px;padding:10px 18px;border-radius:20px;z-index:120;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .note{font-size:11px;color:var(--muted);text-align:center;margin:18px 6px 0;line-height:1.5}
  .chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .chip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:20px;cursor:pointer}
  .chip.on{background:var(--accent);color:#241200;border-color:var(--accent)}

  .mascot{position:fixed;z-index:60;right:14px;bottom:108px;max-width:540px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
  .bubble{background:#fff;color:#171029;font-weight:700;font-size:13px;padding:9px 13px;border-radius:16px 16px 4px 16px;box-shadow:var(--shadow);max-width:230px;margin-bottom:6px;opacity:0;transform:translateY(6px) scale(.9);transition:opacity .25s,transform .25s;line-height:1.35}
  .bubble.show{opacity:1;transform:none}
  .tiger{cursor:pointer;pointer-events:auto;transition:transform .2s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
  .tiger.bounce{animation:bounce .5s ease}
  @keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-15px) rotate(-6deg)}60%{transform:translateY(-4px) rotate(4deg)}}

  .player{text-align:center} .ring{width:230px;height:230px;margin:8px auto 10px;position:relative;display:flex;align-items:center;justify-content:center}
  .ring svg.rg{position:absolute;inset:0} .ring .rtime{font-size:52px;font-weight:800} .ring .rphase{position:absolute;bottom:24px;left:0;right:0;font-size:13px;color:var(--muted);font-weight:700}
  .stepname{font-size:20px;font-weight:800;margin:4px 0} .stepdesc{color:var(--muted);font-size:13px;margin-bottom:8px;line-height:1.4}
  .steplist{margin-top:14px} .steprow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:13px}
  .steprow.cur{background:var(--card2);border:1px solid var(--brand)} .steprow.done{opacity:.5}
  .qopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px;padding:13px 15px;border-radius:14px;margin-bottom:10px;cursor:pointer}
  .qopt.correct{background:var(--green);color:#04240f;border-color:var(--green)} .qopt.wrong{background:var(--red);color:#3a0008;border-color:var(--red)}
  .qprog{height:8px;background:color-mix(in srgb,var(--bg) 55%,#000);border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px} .qprog>div{height:100%;background:var(--brand);transition:width .3s}
  .vocab{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)} .vocab .kr{font-weight:800;font-size:14px} .vocab .en{color:var(--muted);font-size:12.5px;text-align:right}

  .searchbar{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin-bottom:12px}
  .searchbar .ic{color:var(--muted)} .searchbar input{flex:1;background:none;border:none;color:var(--ink);font-size:15px;padding:10px 4px;outline:none} .searchbar input::placeholder{color:var(--muted)}
  .micbtn{background:var(--purple);color:#fff;border:none;width:40px;height:40px;border-radius:11px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .micbtn.live{animation:pulse 1s infinite} @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,107,255,.6)}50%{box-shadow:0 0 0 10px rgba(139,107,255,0)}}
  .bibcard,.storycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .1s} .bibcard:active,.storycard:active{transform:scale(.99)}
  .bc{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px} .bt{font-weight:800;font-size:15px;margin:3px 0 4px} .bp{color:var(--muted);font-size:12.5px;line-height:1.5}
  .tline{display:flex;gap:12px} .tline .ty{font-weight:800;color:var(--accent);font-size:14px;min-width:64px;text-align:right} .tline .tc{border-left:2px solid var(--line);padding:0 0 16px 14px;position:relative} .tline .tc:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)} .tline .th{font-weight:800;font-size:14px} .tline .td{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
  .storycard{display:flex;gap:12px;align-items:center} .storycard .sico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}

  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 262px);min-height:340px}
  .chatlog{flex:1;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .msg.coach{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
  .msg.user{background:var(--blue);color:#042038;border-bottom-right-radius:5px;align-self:flex-end;font-weight:700}
  .msg .cr{font-size:11px;color:var(--accent);font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:6px}
  .readbtn{margin-left:auto;cursor:pointer;color:var(--muted)}
  .chatin{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
  .chatin input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:15px;padding:12px 14px;border-radius:14px;outline:none}
  .sendbtn{background:var(--brand);color:#241200;border:none;width:44px;height:44px;border-radius:13px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}

  .onb{position:fixed;inset:0;z-index:200;background:radial-gradient(1000px 520px at 50% 0%,#2a1d6e,#0b1020);display:flex;align-items:center;justify-content:center;padding:20px;color:#eaf0ff}
  .onbcard{width:100%;max-width:420px;text-align:center}
  .onbcard h1{font-size:26px;margin:14px 0 6px} .onbcard h1 span{color:var(--brand)}
  .onbcard p{color:#93a0c8;font-size:14px;margin:0 0 20px;line-height:1.5}
  .inp{width:100%;background:#161f3f;border:1px solid #28345f;color:#eaf0ff;font-size:16px;padding:14px;border-radius:14px;text-align:center;font-weight:700;margin-bottom:14px}
  .opts{display:grid;gap:10px;margin-bottom:8px}
  .optbtn{background:#161f3f;border:1px solid #28345f;color:#eaf0ff;font-weight:800;font-size:15px;padding:14px;border-radius:14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
  .optbtn.on{border-color:var(--brand);background:#1d284f} .optbtn .oico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto} .optbtn .osub{color:#93a0c8;font-size:12px;font-weight:600;margin-top:1px}

  .videoModal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
  .videoModal.open{display:flex}
  .videoModal .vbox{width:100%;max-width:640px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid #333;background:#000}
  .videoModal iframe{width:100%;height:100%;border:0}
  .videoModal .vclose{color:#fff;font-weight:800;margin-top:14px;background:#222;border:1px solid #444;padding:10px 18px;border-radius:20px;cursor:pointer}
  /* ===== MODERN REFRESH ===== */
  body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(600px 400px at 12% 8%,rgba(255,122,26,.16),transparent 60%),
    radial-gradient(560px 380px at 88% 4%,rgba(139,107,255,.18),transparent 60%),
    radial-gradient(700px 500px at 50% 100%,rgba(34,201,192,.10),transparent 60%);

const BIBCATS=[["all","All"],["origins","Origins"],["history","History"],["people","People"],["styles","Styles"],["philosophy","Philosophy"],["olympics","Olympics"],["words","Words"],["timeline","Timeline"]];
const BIBLE=[
 {id:"b1",cat:"origins",title:"Ancient Roots (Over 2,000 Years)",tags:["korea","goguryeo","three kingdoms","ancient"],body:"Taekwondo grew from very old Korean fighting arts. During Korea's Three Kingdoms era (about 57 BC to 668 AD), warriors trained in unarmed combat. Paintings on the walls of ancient Goguryeo royal tombs show figures in fighting stances, some of the oldest hints of Korean martial arts. So when you kick and block today, you are part of a story thousands of years old.",dyk:"Some tomb murals showing fighters are around 1,500 years old."},
 {id:"b2",cat:"origins",title:"Taekkyon, the Dancing Kicks",tags:["taekkyon","kicks","folk"],body:"Taekkyon is a traditional Korean art famous for smooth, flowing, almost dance-like leg techniques and sweeps. Many people see it as a grandparent of Taekwondo's amazing kicks. It was even played as a folk game at festivals, and today it is protected as a national treasure of Korean culture.",dyk:"Taekwondo is famous worldwide for spectacular kicks. Thank Taekkyon for that spirit."},
 {id:"b3",cat:"origins",title:"Subak and Old Korean Combat",tags:["subak","hand","combat"],body:"Subak is an old name found in Korean history for hand-to-hand fighting skills. Along with Taekkyon, these traditional arts formed the deep roots that modern Taekwondo would later grow from.",dyk:""},
 {id:"b4",cat:"origins",title:"The Hwarang Warriors",tags:["hwarang","silla","honor","respect"],body:"The Hwarang were an elite group of young warriors in the Silla Kingdom. They trained their bodies and their character, following a code of loyalty, courage, and honor. Their spirit of respect and never-give-up attitude still lives in Taekwondo today. One ITF pattern, Hwa-Rang, is named after them.",dyk:"The Hwarang proved a true warrior is strong in heart, not just in body."},
 {id:"b5",cat:"history",title:"After 1945, the Kwans Open",tags:["kwans","schools","1945","seoul"],body:"After 1945, new martial arts schools called kwans opened in Seoul. Their teachers had studied Korean, Chinese, and Japanese arts and blended the best ideas. These kwans became the building blocks of modern Taekwondo, but at first everyone taught a little differently.",dyk:"The word kwan means school or hall."},
 {id:"b6",cat:"history",title:"The Name Taekwondo (1955)",tags:["name","1955","choi","meaning"],body:"The many kwans wanted one name for their shared art. Around 1955 the name Tae Kwon Do was chosen, largely credited to General Choi Hong Hi. It combines three Korean words: TAE (foot or kick), KWON (fist or hand), and DO (the way). So Taekwondo means the way of the foot and fist.",dyk:"Say it: Tae is kick, Kwon is punch, Do is the way."},
 {id:"b7",cat:"history",title:"Growing Around the World",tags:["global","world","spread","popular"],body:"From the 1960s onward, Korean masters traveled the globe teaching Taekwondo. It spread to hundreds of countries and became one of the most practiced martial arts on Earth, with tens of millions of students. Today you can find a dojang almost anywhere.",dyk:""},
 {id:"b8",cat:"people",title:"General Choi Hong Hi",tags:["choi","founder","itf","general"],body:"General Choi Hong Hi (1918 to 2002) is often called a principal founder of Taekwondo. He helped choose the name in 1955, founded the International Taekwon-Do Federation in 1966, and created the Chang Hon patterns like Chon-Ji. He worked to spread Taekwondo internationally.",dyk:"The ITF patterns you learn were designed under General Choi."},
 {id:"b9",cat:"people",title:"Dr. Kim Un-yong and the Olympic Dream",tags:["kim","wtf","olympic"],body:"Dr. Kim Un-yong became the first president of the World Taekwondo Federation in 1973 and pushed hard to get Taekwondo into the Olympic Games. Thanks to leaders like him, kids everywhere can now dream of Olympic gold.",dyk:""},
 {id:"b10",cat:"styles",title:"ITF, International Taekwon-Do Federation",tags:["itf","chang hon","tul","stripes"],body:"The ITF was founded in 1966 by General Choi. It uses the Chang Hon tul (patterns like Chon-Ji and Dan-Gun), a springy up-and-down motion, and belt ranks that often use white belts with colored stripes between the solid colors, exactly the stripe system many kids start with.",dyk:"ITF patterns are called tul."},
 {id:"b11",cat:"styles",title:"WT and the Kukkiwon",tags:["wt","kukkiwon","taegeuk","poomsae","olympic"],body:"The Kukkiwon, the World Taekwondo headquarters in Seoul, opened in 1972. The World Taekwondo Federation formed in 1973. This style uses Taegeuk poomsae, Olympic-style sparring, and solid belt colors. In 2017 the federation shortened its name to World Taekwondo.",dyk:"WT patterns are called poomsae."},
 {id:"b12",cat:"styles",title:"ITF vs WT, What is the Difference?",tags:["itf","wt","difference","compare"],body:"Both are real Taekwondo. ITF (Chang Hon patterns, striped belts) came from General Choi. WT or Kukkiwon (Taegeuk poomsae, Olympic sparring, solid belts) is the Olympic style. Schools pick one system, so ask your instructor which yours uses. In this app you can explore both.",dyk:""},
 {id:"b13",cat:"philosophy",title:"The Five Tenets",tags:["tenets","courtesy","integrity","perseverance","spirit"],body:"The Five Tenets are the heart of Taekwondo. One, Courtesy, be polite and respectful. Two, Integrity, be honest and do what is right. Three, Perseverance, never give up. Four, Self-Control, stay calm and in charge of yourself. Five, Indomitable Spirit, be brave no matter what. Say them before you train.",dyk:"A black belt in character matters as much as a black belt in kicks."},
 {id:"b14",cat:"philosophy",title:"What DO Really Means",tags:["do","way","path","character"],body:"The DO in Taekwon-DO means the way, a path you walk your whole life. Taekwondo is not only about fighting, it is about becoming a kinder, braver, more disciplined person. That is why we bow, show respect, and help others.",dyk:""},
 {id:"b15",cat:"philosophy",title:"Why Belt Colors Change",tags:["belt","colors","white","black"],body:"Belts tell the story of a growing plant. White is a seed of innocence. Yellow is earth where roots take hold. Green is the plant growing. Blue is reaching for the sky. Red is caution and control. Black is maturity, and a brand new beginning as a leader who helps others.",dyk:"Black belt is not the end, it is the start of teaching."},
 {id:"b16",cat:"philosophy",title:"Why We Practice Patterns",tags:["patterns","poomsae","tul","forms"],body:"A pattern (poomsae or tul) is a set of moves done in order against imaginary opponents. Patterns teach balance, memory, power, and focus all at once. Each ITF pattern has a meaning and is named after a Korean hero or idea, so you learn history while you train.",dyk:""},
 {id:"b17",cat:"olympics",title:"The Road to the Olympics",tags:["olympic","1988","2000","sydney","seoul"],body:"Taekwondo's Olympic journey: the IOC recognized the sport in 1980, it appeared as a demonstration sport at the 1988 Seoul Olympics, it was adopted in 1994, and it finally became an official medal sport at the 2000 Sydney Olympics. Now athletes from around the world compete for gold.",dyk:"Sydney 2000 saw the first Taekwondo Olympic medals."},
 {id:"b18",cat:"olympics",title:"Olympic Taekwondo Today",tags:["olympic","sparring","rules","kyorugi"],body:"Olympic Taekwondo is full-contact sparring on a mat, with athletes scoring points for kicks and punches to the body and head. Modern matches use electronic scoring gear inside the chest protector and helmet to count valid hits fairly. Fighters compete in weight classes.",dyk:"Head kicks score the most points."},
 {id:"b19",cat:"words",title:"Korean You Will Hear in Class",tags:["korean","words","dojang","kihap"],body:"Class is often run in Korean. Some words: dojang is the training hall, dobok is the uniform, ti is the belt, sabeomnim is the master instructor, charyeot is attention, kyeongnye is bow, junbi is ready, sijak is begin, and kihap is your loud spirit shout.",dyk:"A loud kihap makes your strikes stronger and braver."},
 {id:"b20",cat:"history",title:"Taekwondo and Korea's Heart",tags:["korea","culture","national"],body:"Taekwondo is a national sport of South Korea and a proud part of Korean culture that Korea has shared with the whole world. When you train, you honor a country's traditions and join a global family of millions of martial artists.",dyk:""},
 {id:"b21",cat:"philosophy",title:"The Student Oath",tags:["oath","promise","values","character"],body:"Many schools begin class with a student oath, a promise you make out loud. It usually includes: I will observe the tenets of Taekwondo, I will respect my instructors and seniors, I will never misuse Taekwondo, I will be a champion of freedom and justice, and I will build a more peaceful world. Saying it reminds you that your skills come with responsibility.",dyk:"Speaking a promise out loud makes it easier to keep."},
 {id:"b22",cat:"words",title:"Ranks: Gup and Dan",tags:["gup","dan","rank","belt","black belt"],body:"Colour belts are counted in gup (or geup), and they count DOWN as you improve: a 10th gup is a beginner, and 1st gup is just below black belt. Black belt degrees are called dan, and they count UP: 1st dan, 2nd dan, and beyond. Young black belts sometimes earn a poom rank before they are old enough for full dan.",dyk:"Gup counts down to black belt; dan counts up from it."},
 {id:"b23",cat:"olympics",title:"Taekwondo Around the World Today",tags:["world","global","para","modern","millions"],body:"Today tens of millions of people train Taekwondo in more countries than almost any other martial art. It is an Olympic sport, and Para-Taekwondo is part of the Paralympic Games, so athletes of all abilities compete. From tiny dojangs to world championships, you are part of something huge.",dyk:"Para-Taekwondo made its Paralympic debut at the Tokyo 2020 Games."}

const STORYCATS=[["all","All"],["champion","Champion Heart"],["mind","Mind Focus"],["body","Body Control"],["respect","Respect"],["courage","Courage"],["journey","Cub to Master"]];
const STORIES=[
 {id:"st1",cat:"champion",title:"The Two Cubs",ic:"flame",c:"#ff7a1a",mins:2,body:"Two tiger cubs, Tygo and Rocky, started Taekwondo on the very same day. Master Stripe showed them a side kick. It was wobbly and hard. Rocky tried three times, fell over, and said, 'This is too hard, I quit,' and he went to sit down. Tygo fell over too. But Tygo stood up and tried again. And again. His legs were tired and his kick was still messy. 'Slow down,' said Master Stripe. 'A little better each day is how tigers grow.' So every day Tygo practiced just five kicks. Not a hundred. Just five, but he really tried on each one. Weeks later the class had a test. Tygo snapped a clean, strong side kick, and the whole dojang cheered. Rocky watched from the side and felt sorry he had quit. So the next day, Rocky came back and started again, and this time Tygo helped him up when he fell.",moral:"The one who keeps trying beats the one who quits. A little better every day wins."},
 {id:"st2",cat:"champion",title:"The Heart of a Champion",ic:"heart",c:"#ff5468",mins:2,body:"At the big tournament, everyone wanted the gold trophy. A cub named Luna won all her matches. But when a smaller cub named Pip tripped and dropped his water and started to cry, Luna stopped celebrating. She walked over, helped Pip up, picked up his water, and told him, 'That was a brave match. I saw you never stop trying.' Pip smiled through his tears. Later, Master Stripe gave Luna the gold medal. 'You are a champion,' he said, 'not only because you won, but because your heart stayed kind while you were winning. Anyone can be strong. A champion is strong AND kind.'",moral:"A real champion has a kind, brave heart, not just a shiny trophy."},
 {id:"st3",cat:"mind",title:"The Wobbly Board",ic:"target",c:"#3aa0ff",mins:2,body:"Tygo stared at the wooden board he had to break. His hands felt shaky. 'I cannot do it,' he whispered. Master Stripe knelt down. 'Where are your eyes looking?' he asked. 'At the board,' said Tygo. 'That is the problem,' smiled the master. 'Do not aim AT the board. Aim THROUGH it. Picture your hand already on the other side.' Tygo closed his eyes, took one slow breath, and imagined his fist finishing past the board. He opened his eyes, shouted a huge kihap, and struck. Crack. The board split clean in two. It was not his hand that changed. It was his mind.",moral:"Focus your mind on where you are going, not on what is in the way."},
 {id:"st4",cat:"body",title:"Still Like a Mountain",ic:"flag",c:"#2fd07a",mins:2,body:"Tygo could kick fast, but he wobbled like jelly when he tried to stand on one leg. He got frustrated and flopped down. Master Stripe pointed to the mountain outside. 'The mountain has stood in storms for a thousand years. How? It is rooted, and it is calm.' He told Tygo to pick one small spot on the wall and stare at it, to press his standing foot into the floor like roots, and to breathe slowly. Tygo tried. His eyes went still. His foot gripped. His breath slowed. And there he stood, on one leg, calm and strong, for ten whole seconds. 'Your body listens,' said the master, 'when your mind is quiet.'",moral:"Balance comes from a calm mind and a rooted body. Be still like a mountain."},
 {id:"st5",cat:"courage",title:"The Loud Kihap",ic:"bolt",c:"#ffb020",mins:2,body:"Tygo had a tiny voice. When the class shouted their kihap, his came out like a squeak, and some cubs giggled. He felt embarrassed. Master Stripe gathered the class. 'Your kihap is not just noise,' he said. 'It is your brave voice. It tightens your body so your strike is strong, and it tells fear to step aside.' He asked Tygo to take a big breath all the way to his belly, and let it out with everything he had. HYAH. The sound filled the whole dojang. The cubs stopped giggling. They cheered. Tygo grinned. His voice had been in there the whole time. He just needed the courage to let it out.",moral:"Your brave voice was always inside you. A big kihap wakes up your courage."},
 {id:"st6",cat:"mind",title:"The Angry Storm",ic:"leaf",c:"#22c9c0",mins:2,body:"During sparring practice, a cub named Max tapped Tygo a little too hard, and Tygo felt hot anger rise up like a storm. He wanted to hit back hard. But Master Stripe's voice came into his head: 'A warrior who cannot control himself controls nothing.' Tygo stopped. He took one slow breath in, and one slow breath out. The storm inside got smaller. He bowed to Max, calm again, and they kept training safely. Later Max said sorry. 'You did the strongest thing today,' Master Stripe told Tygo. 'You controlled the storm inside you. That is harder than any kick.'",moral:"Controlling your own temper is the strongest move of all."},
 {id:"st7",cat:"journey",title:"The Slow Path Up the Mountain",ic:"clock",c:"#8b6bff",mins:2,body:"Tygo looked up at the tall mountain of the black belt and sighed. 'It is too far. I will never get there.' Master Stripe handed him a small stone. 'Every day, carry one stone up the path and place it down. Just one.' 'One stone will take forever,' said Tygo. 'It will take exactly as long as it takes,' the master smiled. So Tygo climbed a little each day. Some days he was tired. Some days it rained. But he placed one stone every day. He did not always notice himself getting stronger, but one morning he looked back down the mountain and could not believe how high he had already climbed.",moral:"Big goals are reached one small step at a time. Keep placing your stone."},
 {id:"st8",cat:"respect",title:"Master Stripe's Secret",ic:"heart",c:"#ff5468",mins:2,body:"Tygo wanted to know the master's secret. 'How did you become so great?' he asked. Master Stripe thought about it. 'When I was a young cub, I only wanted to win, to be the best, to collect trophies. I was fast, but my heart was small. Then one day my teacher asked me to help a struggling student tie his belt and learn his form. Helping him felt better than any trophy I ever won. That day I understood. The real black belt is not around your waist. It is the way you lift others up.'",moral:"The greatest masters are the ones who help others grow."},
 {id:"st9",cat:"respect",title:"The Cub Who Bowed",ic:"flag",c:"#2fd07a",mins:2,body:"A new cub named Bruno was very talented, the fastest kicker anyone had seen. But he never bowed, he talked over his teacher, and he laughed when others made mistakes. One day the dojang held a demonstration, and Bruno was sure he would be chosen to lead it. Instead, Master Stripe chose quiet little Ivy, who always bowed, always listened, and always cheered for her classmates. 'But I am the best kicker,' said Bruno. 'Skill fills your hands,' said the master gently. 'Respect fills the room. A leader needs both.' Bruno went quiet. The next class, he walked in and bowed first.",moral:"Talent is good, but respect is what makes people follow you."},
 {id:"st10",cat:"courage",title:"Get Up Eight Times",ic:"flame",c:"#ff7a1a",mins:2,body:"Tygo was learning a jumping spin kick, and he kept landing flat on the floor. One fall. Two. Five. By the seventh fall he was covered in dust and ready to cry. 'I fell seven times,' he groaned. Master Stripe helped him up. 'Then you only need to rise one more time than you fall. There is an old saying: fall down seven times, get up eight.' Tygo wiped his eyes, took a breath, and launched into the air one more time. This time he landed it, wobbly but standing. Falling was never the failure. Staying down would have been.",moral:"Falling is not failing. The champion is the one who always gets back up."},
 {id:"st11",cat:"journey",title:"From Cub to Master",ic:"trophy",c:"#ffcf3f",mins:3,body:"Years passed at the dojang. The wobbly little cub named Tygo was now tall and strong, and today he tied a black belt around his waist for the first time. He remembered falling on his very first side kick. He remembered his squeaky kihap, his shaky hands before the board, and the seven times he hit the floor learning to jump. Master Stripe, older now, smiled proudly. 'You thought the black belt was the top of the mountain,' he said. 'But look around. There are young cubs here now, wobbling on their first kicks, just like you did.' Tygo understood. He knelt beside a small cub who had just fallen, and gently said, 'Try again. A little better every day. I will help you up.' And that is how a tiger becomes a master.",moral:"Growing from a cub to a master never ends. When you rise, you turn back and lift others."},
 {id:"st12",cat:"body",title:"Two Ears, One Mouth",ic:"target",c:"#3aa0ff",mins:2,body:"Tygo loved to talk during class, even while the master was teaching. So he often missed the small, important tips, and his forms stayed messy. One day Master Stripe said, 'A tiger has two ears and one mouth. Use them in that order.' Tygo laughed, but he tried it. He kept his mouth quiet and his ears wide open. He heard the master say to keep his heel down, to breathe on the strike, to look before he turned. His forms became crisp and sharp almost overnight. He had known how to move his body all along. He just finally listened.",moral:"Listen more than you talk, and your body will learn twice as fast."},
 {id:"st13",cat:"respect",title:"The Empty Cup",ic:"heart",c:"#8b6bff",mins:2,body:"A talented red belt named Ravi thought he already knew everything. When Master Stripe offered a tip, Ravi would say, 'I know, I know.' One day the master poured tea into Ravi's cup and kept pouring until it spilled all over the table. 'Master, stop, it is full,' Ravi cried. Master Stripe smiled. 'Yes. And like this cup, a mind that is already full cannot take in anything new. Empty your cup, and you can keep learning forever.' Ravi went quiet. From that day he listened like a white belt again, and he grew faster than ever. The best black belts are the ones who never stop being students.",moral:"Stay humble and keep an empty cup. That is how you keep growing."},
 {id:"st14",cat:"courage",title:"The First Day",ic:"flag",c:"#2fd07a",mins:2,body:"On her very first day, a small cub named Zoe stood at the dojang door, frozen. Everyone looked so good, and she felt tiny and scared. She almost turned around and went home. But she took one slow breath and one small brave step through the door. A friendly student named Leo waved her over and showed her where to stand. Her first kicks were wobbly and her kihap was a squeak, but she was there. A year later, Zoe stood at that same door, now waving in a brand new frightened cub. She remembered exactly how it felt. Every master was once the nervous new kid who was brave enough to walk in.",moral:"Courage is just one small brave step. Take it, and you belong."}
];

function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type,vol){if(!state.sound)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.12;o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur);}

if('speechSynthesis'in window){try{speechSynthesis.onvoiceschanged=function(){TP_VOICE=pickVoice();};TP_VOICE=pickVoice();}catch(e){}}
function speak(text){if(!state.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(!TP_VOICE)TP_VOICE=pickVoice();if(TP_VOICE)u.voice=TP_VOICE;u.rate=.95;u.pitch=1.05;u.volume=1;speechSynthesis.speak(u);}catch(e){}}

function timerCtl(label,key,step){return '<div style="flex:1"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">'+label+'</div><div style="display:flex;align-items:center;gap:6px;justify-content:center;background:color-mix(in srgb,var(--bg) 55%,#000);border:1px solid var(--line);border-radius:12px;padding:8px"><button class="iconbtn" onclick="adjTimer(\''+key+'\',-'+step+')">-</button><span id="t_'+key+'" style="font-weight:800;font-size:17px;min-width:30px;text-align:center">'+timerCfg[key]+'</span><button class="iconbtn" onclick="adjTimer(\''+key+'\','+step+')">+</button></div></div>';}

function ringSVG(id,color){const dash=2*Math.PI*100;return '<svg class="rg" width="230" height="230" viewBox="0 0 230 230"><circle cx="115" cy="115" r="100" stroke="#2c3560" stroke-width="12" fill="none"/><circle id="'+id+'" cx="115" cy="115" r="100" stroke="'+color+'" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="'+dash+'" stroke-dashoffset="0" transform="rotate(-90 115 115)"/></svg>';}
function sessionHTML(){const w=sess.w,st=w.steps[sess.idx];const steps=w.steps.map((s,i)=>'<div class="steprow '+(i===sess.idx?'cur':'')+' '+(i<sess.idx?'done':'')+'"><span>'+ic(s.ic||'activity',18)+'</span><span>'+s.n+'</span><span style="margin-left:auto;color:var(--muted)">'+s.s+'s</span></div>').join('');
 return '<h3>'+w.n+'</h3><div style="color:var(--muted);font-size:12px;font-weight:700">Step '+(sess.idx+1)+' of '+w.steps.length+'</div><div class="player"><div class="ring">'+ringSVG('ringP','url(#grd)')+'<svg width="0" height="0"><defs><linearGradient id="grd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#2fd07a"/></linearGradient></defs></svg><div class="rtime" id="ringT">'+sess.left+'</div></div><div class="stepname">'+st.n+'</div><div class="stepdesc">'+st.d+'</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn ghost" style="margin:0" onclick="pauseSession()" id="pauseBtn">'+ic('pause',16)+' Pause</button><button class="btn ghost" style="margin:0" onclick="skipStep()">'+ic('skip',16)+' Skip</button><button class="btn ghost" style="margin:0" onclick="stopSession()">Stop</button></div><div class="steplist">'+steps+'</div></div>';}
function runSessionTick(){clearInterval(sess.timer);sess.timer=setInterval(()=>{if(sess.paused)return;sess.left--;const st=sess.w.steps[sess.idx];if($('ringT'))$('ringT').textContent=Math.max(0,sess.left);if($('ringP')){const dash=2*Math.PI*100;$('ringP').style.strokeDashoffset=dash*(1-sess.left/st.s);}if(sess.left<=3&&sess.left>0)SFX.tick();if(sess.left<=0)nextStep();},1000);}
function nextStep(){SFX.ok();if(sess.idx>=sess.w.steps.length-1){finishSession();return;}sess.idx++;sess.left=sess.w.steps[sess.idx].s;const st=sess.w.steps[sess.idx];if(/kick|pattern|full speed|combo|jab|cross|roundhouse/i.test(st.n))setTimeout(()=>SFX.kihap(),200);speak(st.n+'. '+st.d);$('sheetBody').innerHTML=sessionHTML();}
function skipStep(){SFX.tap();sess.left=0;}
function pauseSession(){sess.paused=!sess.paused;$('pauseBtn').innerHTML=ic(sess.paused?'play':'pause',16)+(sess.paused?' Resume':' Pause');SFX.tap();}

let rt=null;
function startRoundTimer(spar){ac();rt={round:1,phase:'work',left:timerCfg.work,spar:spar};openSheet(roundHTML());SFX.belt();speak(spar?('Round 1. '+SPARCOMBOS[Math.floor(Math.random()*SPARCOMBOS.length)]):'Round 1. Fight.');rt.timer=setInterval(()=>{rt.left--;if($('ringT'))$('ringT').textContent=rt.left;const tot=rt.phase==='work'?timerCfg.work:timerCfg.rest;if($('ringP')){const dash=2*Math.PI*100;$('ringP').style.strokeDashoffset=dash*(1-rt.left/tot);}if(rt.left<=3&&rt.left>0)SFX.tick();if(rt.left<=0){SFX.belt();if(rt.phase==='work'){if(rt.round>=timerCfg.rounds){finishRounds();return;}rt.phase='rest';rt.left=timerCfg.rest;speak('Rest.');}else{rt.round++;rt.phase='work';rt.left=timerCfg.work;speak(rt.spar?('Round '+rt.round+'. '+SPARCOMBOS[Math.floor(Math.random()*SPARCOMBOS.length)]):('Round '+rt.round+'. Fight.'));}$('sheetBody').innerHTML=roundHTML();}},1000);}

let breatheRun=false,breathePhase=0,breatheTimer=null;
const PHASES=[['Breathe in','inhale',4],['Hold','',4],['Breathe out','exhale',4],['Hold','',2]];
function toggleBreathe(){ac();breatheRun=!breatheRun;const btn=$('breatheBtn');if(breatheRun){btn.innerHTML=ic('pause',18)+' Stop';breathePhase=0;stepBreathe();}else{btn.innerHTML=ic('play',18)+' Start breathing';clearTimeout(breatheTimer);const c=$('bcircle');if(c){c.className='bcircle';c.textContent='Tap Start';}}}

let rg=null;
function gameReaction(){rg={round:0,waiting:false,times:[]};openSheet('<h3>Kick Reaction</h3><p style="color:var(--muted);font-size:13px">Tap the pad the moment it turns green. 5 rounds.</p><div id="rgPad" style="margin:16px 0;height:220px;border-radius:18px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;cursor:pointer" onclick="rgTap()">Tap to start</div><div id="rgInfo" style="text-align:center;color:var(--muted);font-size:13px">Round 0 / 5</div>');}
function rgNext(){const pad=$('rgPad');if(!pad)return;rg.waiting=false;pad.style.background='var(--red)';pad.style.color='#fff';pad.textContent='Wait for green';rg.t=setTimeout(()=>{if(!$('rgPad'))return;rg.waiting=true;rg.start=Date.now();pad.style.background='var(--green)';pad.style.color='#04240f';pad.textContent='KICK';SFX.kihap();},800+Math.random()*2200);}
function rgTap(){const pad=$('rgPad');if(!pad)return;if(rg.round===0&&!rg.waiting&&pad.textContent.indexOf('Tap to start')>=0){rg.round=1;$('rgInfo').textContent='Round 1 / 5';rgNext();return;}if(!rg.waiting){clearTimeout(rg.t);SFX.wrong();pad.style.background='var(--card2)';pad.style.color='var(--ink)';pad.textContent='Too early. Tap to retry';return;}const ms=Date.now()-rg.start;rg.times.push(ms);SFX.ok();buzz();pad.style.background='var(--card2)';pad.style.color='var(--ink)';pad.textContent=ms+' ms';if(rg.round>=5){const avg=Math.round(rg.times.reduce((a,b)=>a+b,0)/rg.times.length);const score=Math.max(0,1000-avg);const best=setHS('reaction',score);setTimeout(()=>gameEnd('Average '+avg+' ms',(avg<300?'Lightning reflexes.':avg<450?'Great speed.':'Keep practicing.')+' Score '+score,Math.round(score/50)+5,best),700);return;}rg.round++;$('rgInfo').textContent='Round '+rg.round+' / 5';setTimeout(rgNext,700);}
let bg=null;
function gameBoard(){bg={pos:0,dir:1,broken:0,tries:3,running:true};openSheet('<h3>Board Break</h3><p style="color:var(--muted);font-size:13px">Tap STRIKE when the bar is in the light zone for full power. Break 3 boards.</p><div style="margin:16px 0"><div style="height:34px;border-radius:12px;background:linear-gradient(90deg,var(--red),var(--gold) 70%,var(--gold) 85%,var(--red));position:relative;border:1px solid var(--line)"><div style="position:absolute;top:0;bottom:0;left:70%;width:15%;background:rgba(255,255,255,.2);border-left:2px solid #fff;border-right:2px solid #fff"></div><div id="bgMark" style="position:absolute;top:-4px;width:6px;height:42px;background:#fff;border-radius:3px;left:0"></div></div></div><div id="bgBoard" style="text-align:center;margin:6px 0;color:var(--brand)">'+ic('board',56)+'</div><div id="bgInfo" style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px">Boards broken: 0 / 3</div><button class="btn block" onclick="bgStrike()">STRIKE</button>');bg.timer=setInterval(()=>{if(!$('bgMark')){clearInterval(bg.timer);return;}bg.pos+=bg.dir*3;if(bg.pos>=100){bg.pos=100;bg.dir=-1;}if(bg.pos<=0){bg.pos=0;bg.dir=1;}$('bgMark').style.left=bg.pos+'%';},16);}
function bgStrike(){if(!bg||!bg.running)return;const inZone=bg.pos>=70&&bg.pos<=85;const close=bg.pos>=60&&bg.pos<=92;if(inZone){SFX.kihap();buzz([20,30]);bg.broken++;if($('bgBoard'))$('bgBoard').innerHTML='<span style="color:var(--green)">'+ic('check',56)+'</span>';setTimeout(()=>{if($('bgBoard'))$('bgBoard').innerHTML='<span style="color:var(--brand)">'+ic('board',56)+'</span>';},400);if(bg.broken>=3){bg.running=false;clearInterval(bg.timer);const best=setHS('board',bg.broken);setTimeout(()=>gameEnd('You broke all 3 boards','Perfect power and timing.',30,best),500);return;}}else{SFX.wrong();buzz(40);bg.tries--;if(bg.tries<=0){bg.running=false;clearInterval(bg.timer);const best=setHS('board',bg.broken);setTimeout(()=>gameEnd('Boards broken '+bg.broken+' / 3',(close?'So close. ':'')+'Try again.',bg.broken*5+3,best),400);return;}}if($('bgInfo'))$('bgInfo').textContent='Boards broken: '+bg.broken+' / 3 . Tries left: '+bg.tries;}
let mg=null;const MOVES=[{n:"High Block",f:660,ic:"shield"},{n:"Punch",f:440,ic:"target"},{n:"Kick",f:550,ic:"activity"},{n:"Low Block",f:330,ic:"shield"}];

function mgPlay(){mg.accept=false;if($('mgStatus'))$('mgStatus').textContent='Watch carefully';let i=0;const step=()=>{if(i>=mg.seq.length){mg.accept=true;mg.idx=0;if($('mgStatus'))$('mgStatus').textContent='Your turn. Repeat the moves.';return;}mgFlash(mg.seq[i]);i++;setTimeout(step,700);};setTimeout(step,500);}
function mgFlash(idx){const p=$('mgP'+idx);if(!p)return;const old=p.style.background;p.style.background='var(--brand)';tone(MOVES[idx].f,.25,'triangle',.1);setTimeout(()=>{if($('mgP'+idx))$('mgP'+idx).style.background=old;},350);}
function mgTap(idx){if(!mg.accept)return;mgFlash(idx);SFX.tap();if(idx===mg.seq[mg.idx]){mg.idx++;if(mg.idx>=mg.seq.length){mg.accept=false;SFX.ok();setHS('memory',mg.round);if($('mgStatus'))$('mgStatus').textContent='Correct. Next round.';setTimeout(mgAdd,900);}}else{mg.accept=false;SFX.wrong();buzz(50);const best=setHS('memory',Math.max(0,mg.round-1));setTimeout(()=>gameEnd('You reached round '+mg.round,(mg.round>=6?'Incredible memory.':mg.round>=4?'Great focus.':'Keep training your memory.'),Math.max(5,(mg.round-1)*4),best),500);}}

function confetti(dur){try{let cv=$('fx');if(!cv){cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);}const ctx=cv.getContext('2d');const W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;const cols=['#ff7a1a','#ffb020','#2fd07a','#3aa0ff','#8b6bff','#ff5468','#22c9c0'];const ps=[];for(let i=0;i<130;i++)ps.push({x:W/2+(Math.random()-.5)*90,y:H*0.32+(Math.random()-.5)*40,vx:(Math.random()-.5)*9,vy:Math.random()*-9-4,r:4+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*0.4});const end=Date.now()+(dur||1600);(function frame(){ctx.clearRect(0,0,W,H);let alive=false;ps.forEach(p=>{p.vy+=0.28;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y<H+20)alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});if(alive&&Date.now()<end+900)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H);})();}catch(e){}}

 if(i===fg.cur){const pts=ms<400?15:ms<700?8:3;fg.combo++;const mult=1+Math.floor(fg.combo/3)*0.5;const g=Math.round(pts*mult);fg.score+=g;if(pad)pad.classList.add('hit');SFX.ok();buzz();if($('fgStatus'))$('fgStatus').textContent=(ms<400?'Perfect. No hesitation. ':ms<700?'Nice and quick. ':'Got it. ')+'+'+g+' pts';}
 else{fg.combo=0;if(pad)pad.classList.add('miss');SFX.wrong();buzz(30);if($('fgStatus'))$('fgStatus').textContent='Wrong move. Combo reset.';}

  {n:"Movement intelligence",safe:"Listen to your body and rest when tired.",steps:["Flow between skills","Control every landing","Make it look easy"]}]}
];
function ninjaCount(){return Object.keys(state.ninjaDone||{}).length;}
function renderNinja(){var done=ninjaCount();var html='<div class="card"><h3>'+ic('shield',18)+' Safety first</h3><p>Advanced skills like flips unlock only after you build strength, balance, and coordination, and a parent or instructor approves. Train on mats with a coach. Never try flips alone.</p><div class="row" style="border:none;padding:8px 0 0"><div style="flex:1"><div class="rt">Parent / instructor approval</div><div class="rd">Required for Advanced and Elite tiers.</div></div><button class="btn '+(state.ninjaApproved?'green':'ghost')+'" style="margin:0" onclick="toggleNinjaApproval()">'+(state.ninjaApproved?'Approved':'Approve')+'</button></div></div>';
 NINJA.forEach((t,ti)=>{var unlocked=done>=t.need&&(!t.approve||state.ninjaApproved);html+='<div class="card"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">'+t.tier+'</h3>'+(unlocked?'<span class="combochip">Unlocked</span>':'<span style="color:var(--muted);font-size:12px;font-weight:700">'+ic('lock',14)+' Locked</span>')+'</div><p style="margin-top:6px">'+t.d+'</p>';if(!unlocked)html+='<div class="rd" style="color:var(--muted);margin-top:6px">Unlock by completing '+t.need+' skills'+(t.approve?' and getting approval':'')+'. You have '+done+'.</div>';else html+='<div style="margin-top:6px">'+t.skills.map((s,si)=>{return '<div class="quest" style="margin:8px 0 0;cursor:pointer" onclick="openNinja('+ti+','+si+')"><div class="qico" style="background:color-mix(in srgb,#8b6bff 18%,transparent);color:#8b6bff">'+ic(state.ninjaDone[ti+'_'+si]?'check':'bolt',18)+'</div><div style="flex:1"><div class="qn">'+s.n+'</div><div class="qd">Tap to learn safely</div></div>'+ic('chev',16)+'</div>';}).join('')+'</div>';html+='</div>';});
 $('ninjaBody').innerHTML=html;}
function toggleNinjaApproval(){state.ninjaApproved=!state.ninjaApproved;save();SFX.tap();if(state.ninjaApproved)toast('Advanced tiers unlocked with approval.');renderNinja();}
function openNinja(ti,si){SFX.tap();var t=NINJA[ti],s=t.skills[si];var key=ti+'_'+si;var done=state.ninjaDone[key];openSheet('<h3>'+s.n+'</h3><div class="meaning" style="border-color:rgba(255,84,104,.4);background:color-mix(in srgb,#ff5468 12%,transparent)">'+ic('shield',16)+' <b>Safety:</b> '+s.safe+'</div>'+s.steps.map((x,n)=>'<div class="row"><div class="rico" style="font-weight:800;color:#8b6bff">'+(n+1)+'</div><div class="rt" style="font-weight:600">'+x+'</div></div>').join('')+(done?'<div style="text-align:center;color:var(--green);font-weight:800;margin-top:14px">Practiced</div>':'<button class="btn purple block" style="margin-top:14px" onclick="practiceNinja('+ti+','+si+')">'+ic('check',18)+' I practiced this safely. +15 XP</button>'));}
function practiceNinja(ti,si){var key=ti+'_'+si;if(!state.ninjaDone[key]){state.ninjaDone[key]=1;ensureSkills();addChar('discipline',3);if(state.skills.coordination!=null)state.skills.coordination=Math.min(100,state.skills.coordination+3);if(state.skills.balance!=null)state.skills.balance=Math.min(100,state.skills.balance+3);save();addXP(15,'Ninja skill practiced. +15 XP');sayMascot('Strong and safe. That is a true ninja.');}closeSheet();renderNinja();}
/* ---------- AGE-EVOLVING ---------- */
const STAGE={
 lt:"Right now, learning happens through play, stories, colors, and big movements. Have fun, be kind, and move your body every day.",
 jr:"This is the age of games, missions, and growing confidence while you build your first solid techniques.",
 yt:"Time to master skills, build strong daily habits, take on responsibility, and learn teamwork.",
 tn:"Now you push athletic performance, resilience, and leadership, and prepare for competition. Financial and personal growth begin here.",
 ad:"Your focus is leadership, mentoring younger students, lifelong fitness, goal setting, entrepreneurship, and giving back to your community."
};
const CHALLENGES_BY_AGE={
 lt:["Do 5 big tiger kicks and a loud shout","Balance on one leg like a flamingo","Show a grown-up your best kick","Give someone a kind high five","Stretch up tall like a tree"],
 tn:["Do a 20-minute conditioning workout","Lead a warm-up for others","Practice your pattern until it is crisp","Set and write down one goal","Do mobility and stretching for 10 minutes"],
 ad:["Complete a full personal training session","Mentor or encourage a younger student","Review your goals for the month","Do a mobility and recovery routine","Practice one leadership habit today"]
};

 lt:[{t:"Draw a picture of your favorite Taekwondo move",xp:10,coins:2,ch:"confidence",ic:"star"},{t:"Do 5 big animal jumps like a tiger",xp:10,coins:2,ch:"discipline",ic:"activity"}],
 jr:[{t:"Beat your Kick Reaction high score",xp:15,coins:3,ch:"focus",ic:"bolt"},{t:"Show a parent your newest kick",xp:10,coins:2,ch:"confidence",ic:"medal"}],
 yt:[{t:"Help teach a younger student one move",xp:20,coins:4,ch:"leadership",ic:"users"},{t:"Set one goal for this week and write it down",xp:15,coins:3,ch:"responsibility",ic:"flag"}],
 tn:[{t:"Do a 20-minute conditioning workout",xp:20,coins:4,ch:"discipline",ic:"dumbbell"},{t:"Lead a warm-up for the class or family",xp:20,coins:5,ch:"leadership",ic:"flag"},{t:"Save coins toward a real goal",xp:15,coins:0,ch:"discipline",ic:"star"}],
 ad:[{t:"Mentor or encourage a younger student",xp:20,coins:5,ch:"leadership",ic:"users"},{t:"Complete a full personal training session",xp:20,coins:4,ch:"discipline",ic:"dumbbell"},{t:"Write one goal for the month",xp:15,coins:3,ch:"focus",ic:"flag"}]
};
function stageCard(){var st=STAGE[state.age];if(!st)return '';var a=AGES[state.age];return '<div class="card" style="background:linear-gradient(135deg,#1d284f,#232c69);border:none"><div class="row" style="border:none;padding:0"><div class="rico" style="background:#22c9c0;color:#04240f">'+ic(a.icon,18)+'</div><div><div class="rt">Your stage: '+a.label+' ('+a.range+')</div><div class="rd" style="line-height:1.5">'+st+'</div></div></div></div>';}
function setAgeStage(k){state.age=k;save();toast(AGES[k].label+' stage');renderHome();openSettings();}
function ageStageCard(){return '<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">Age stage (the app grows with your child)</div><div class="chipbar">'+Object.keys(AGES).map(function(k){return '<div class="chip '+(state.age===k?'on':'')+'" onclick="setAgeStage(\''+k+'\')">'+AGES[k].label+'</div>';}).join('')+'</div></div>';}
/* ---------- AI SKILL COACH ---------- */
const SKILLTIP={reaction:"Play Form Flow and Kick Reaction for 5 minutes",kickspeed:"Snap 20 fast front kicks, relax fully between each",kickheight:"Do the full stretch routine, then slow high kicks",power:"Do the Kicking Power workout plus squats",accuracy:"Aim kicks at one small target, slow and exact",balance:"Do Focus and Balance and hold one leg for 30 seconds",coordination:"Try the cartwheel and agility drills in Ninja Athletics",flexibility:"Stretch every day: butterfly, pike, and side lunges",strength:"Push-ups, squats, and plank from Ninja Foundation",core:"Plank and hollow-body holds daily",endurance:"Do a full workout without long breaks",memory:"Play Master Moves and walk your pattern slowly",consistency:"Practice your pattern 3 times, exactly the same",sparconf:"Do Shadow Sparring and the Combo Caller",technique:"Use the Form Trainer and move slowly with no hesitation",attendance:"Show up to class and mark your streak",practice:"Train a few minutes every single day",recovery:"Sleep well and do calm breathing",stretching:"Add the warm-up and stretch routine",disciplineS:"Complete all your daily missions",respectS:"Bow and thank your instructor and parents",leadershipS:"Teach a friend or sibling one thing",listening:"Two ears, one mouth: really listen in class",focusS:"Do Tiger Breath before you train",persistence:"When it feels hard, try one more time"};
function noteTip(t){t=(t||'').toLowerCase();if(/round|kick|chagi/.test(t))return 'snap 20 slow high kicks daily, focus on clean form';if(/balance|stance|wobble/.test(t))return 'do one-leg holds and the Focus and Balance workout';if(/pattern|poomsae|form|tul/.test(t))return 'walk the pattern slowly 3 times, exactly the same';if(/spar|kyorugi|partner/.test(t))return 'do Shadow Sparring and the Combo Caller';if(/flex|split|high|hamstring/.test(t))return 'stretch daily: butterfly, pike, side lunges';if(/power|strong|weak/.test(t))return 'add squats and the Kicking Power workout';if(/memor|forget|remember/.test(t))return 'play Master Moves and review slowly';if(/breath|nervous|scared|calm/.test(t))return 'do Tiger Breath before training';return 'break it into small steps and practice it slowly every day';}
function coachAnalysis(){ensureSkills();var name=state.name||'warrior';var arr=[];SKILLS.forEach(gr=>gr.items.forEach(it=>arr.push([it[0],it[1],state.skills[it[0]]||0])));arr.sort((a,b)=>a[2]-b[2]);var weak=arr.slice(0,3);var strong=arr[arr.length-1];var chArr=CHARS.map(c=>[c[0],c[1],(state.character&&state.character[c[0]])||0]).sort((a,b)=>a[2]-b[2]);var weakCh=chArr[0];var belts=BELTS[state.beltSys];var next=state.beltIndex>=belts.length-1?null:belts[state.beltIndex+1];var tip=w=>SKILLTIP[w]||'Practice it a little every day';var _nt=(state.notes&&state.notes.length)?state.notes[state.notes.length-1]:null;var _nl=(_nt&&(_nt.struggle||_nt.goal))?('From your class notes you flagged: "'+(_nt.struggle||_nt.goal)+'". Fix that first: '+noteTip(_nt.struggle||_nt.goal)+'. '):'';
 return 'Here is your personalized plan, '+name+'. '+_nl+'I looked at your real progress'+(_nt?' and your class notes':'')+', not random exercises.\n\nStrongest area: '+strong[1]+'. Keep it sharp.\n\nBiggest chance to grow: '+weak[0][1]+', '+weak[1][1]+', and '+weak[2][1]+'.\n\nYour week:\n1) '+tip(weak[0][0])+'.\n2) '+tip(weak[1][0])+'.\n3) '+tip(weak[2][0])+'.\n\nCharacter focus: grow your '+weakCh[1]+' by choosing it in today\'s missions and quests.'+(next?'\n\nNext belt goal: '+next.name+', pattern '+next.pattern.n.split('(')[0].trim()+'.':'')+'\n\nDo this three days this week and I will check your graph. You have got this.';}
function coachFocusCard(){ensureSkills();if(!state.skills)return '';var arr=[];SKILLS.forEach(gr=>gr.items.forEach(it=>arr.push([it[1],state.skills[it[0]]||0])));arr.sort((a,b)=>a[1]-b[1]);var w=arr[0];return '<div class="card" style="cursor:pointer;background:linear-gradient(135deg,#3a1d6e,#5a2b9c);border:none;color:#fff" onclick="openCoachPlan()"><div class="row" style="border:none;padding:0"><div class="rico" style="background:rgba(255,255,255,.2);color:#fff">'+ic('mic',18)+'</div><div style="flex:1"><div class="rt">Coach Tygo\'s focus for you</div><div class="rd" style="color:#e9d6ff">Work on '+w[0].toLowerCase()+' next. Tap for your full personalized plan.</div></div>'+ic('chev',18)+'</div></div>';}
function openCoachPlan(){go('coach');setTimeout(function(){askCoach('build me a personalized plan');},350);}
/* ---------- BOOT ---------- */
applyTheme();
if(DB.activeId&&state.onboarded)startApp();else renderOnb();
